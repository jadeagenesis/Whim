<!doctype html>
<!-- Tells the browser this is a modern HTML5 document. -->

<html lang="en">
  <!-- The root element. lang="en" tells screen readers and browsers the page is in English. -->

  <head>
    <!-- The <head> holds information ABOUT the page. Nothing here is shown on screen. -->
    <meta charset="UTF-8" />
    <!-- Character encoding: lets the page display symbols and accents correctly. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Makes the page scale properly on phones and tablets instead of looking tiny/zoomed out. -->

    <title>Whim — Decision Roulette</title>
    <!-- The text shown in the browser tab and in search results. -->

    <link rel="stylesheet" href="style.css" />
    <!-- This is the connection to your CSS file. Without this line, none of the styling appears. -->
  </head>

  <body>
    <!-- Everything inside <body> is what the user actually sees. -->

    <main class="app">
      <!-- <main> means "this is the primary content of the page" (good for accessibility).
         The class="app" is a hook so CSS can target this element. -->

      <!-- ===== 1. HEADER ===== -->
      <header class="header">
        <!-- <header> groups the page's introductory content. -->
        <h1 class="header__title">Whim</h1>
        <!-- <h1> is the single most important heading on the page. -->

        <p class="header__subtitle">Let chance make the decision.</p>
        <!-- A short supporting line of text. -->
      </header>

      <!-- ===== 2. THE DECISION QUESTION ===== -->
      <section class="panel">
        <!-- The question gives the spin some context ("Where should we go
             for the holiday?"). It is not needed for the wheel to work —
             it is just shown again above the winner once the wheel stops.
             It sits above the options so it reads as the frame for
             everything that follows. -->
        <label class="label" for="question-input">What are you deciding?</label>
        <!-- for="question-input" links this label to the input below,
             so clicking the label focuses the field. -->

        <input
          id="question-input"
          class="input input--full"
          type="text"
          placeholder="e.g. Where should we go for the holiday?"
          autocomplete="off"
        />
        <!-- id="question-input" is the hook JavaScript uses to read what the
             user types. The "input--full" class makes it fill the panel
             width, because there is no button beside it to share a row with. -->
      </section>

      <!-- ===== 3. ADD AN OPTION ===== -->
      <section class="panel">
        <!-- <section> groups related content under a heading. .panel adds the "card" look. -->
        <label class="label" for="option-input">Add an option</label>
        <!-- <label> is a text description of an input.
           for="option-input" links it to the input with id="option-input",
           so clicking the label focuses the input (and screen readers read it out). -->

        <div class="input-row">
          <!-- A plain container that places the input and the button side by side. -->

          <input
            id="option-input"
            class="input"
            type="text"
            placeholder="e.g. Pizza, Sushi, Tacos"
            autocomplete="off"
          />
          <!-- <input type="text"> is a one-line text field where the user types an option.
             id="option-input" is the unique name JavaScript will use to grab this element.
             placeholder is the grey hint text shown when the field is empty. -->

          <button id="add-button" class="button button--ghost" type="button">
            Add
          </button>
          <!-- <button> is a clickable control.
             type="button" means "just a button" — it does NOT submit a form or reload the page.
             Right now it does nothing; JavaScript will give it behaviour later. -->
        </div>

        <p id="message" class="message"></p>
        <!-- Empty on purpose. JavaScript puts a short warning here
           (e.g. "Type something first.") when an entry is rejected. -->
      </section>

      <!-- ===== 4. OPTIONS LIST ===== -->
      <section class="panel">
        <h2 class="panel__heading">Options</h2>
        <!-- <h2> is a sub-heading, one level below <h1>. -->

        <ul id="options-list" class="option-list"></ul>
        <!-- <ul> is an "unordered list" — a bullet-point list.
           It is deliberately EMPTY: JavaScript will insert <li> items here later.
           id="options-list" is the hook JavaScript will target. -->

        <p id="empty-message" class="empty-message">
          No options yet — add one above.
        </p>
        <!-- A friendly placeholder message shown while the list is empty.
           JavaScript will hide this once real options exist. -->
      </section>

      <!-- ===== 5. WHEEL + SPIN ===== -->
      <section class="spin-area">
        <!-- .wheel-stage groups the wheel and the pointer so the pointer can be
             positioned relative to the wheel. -->
        <div class="wheel-stage">
          <!-- The pointer sits on the stage, NOT inside .wheel, so it stays
               still while the wheel turns beneath it. aria-hidden tells screen
               readers to ignore it, since it is purely decorative. -->
          <div class="pointer" aria-hidden="true"></div>

          <!-- The wheel rotates as one solid piece: the slices (painted by
               JavaScript as a conic-gradient) and the text labels on them. -->
          <div id="wheel" class="wheel wheel--empty">
            <div id="wheel-labels" class="wheel__labels"></div>
            <!-- Starts empty. JavaScript fills it with one text label per slice. -->
          </div>
        </div>

        <button id="spin-button" class="button button--primary" type="button">
          Spin
        </button>
        <!-- The main call-to-action. JavaScript disables it while the wheel
             is turning so you can't start a second spin mid-animation. -->
      </section>

      <!-- ===== 6. RESULT ===== -->
      <section class="result">
        <h2 class="result__heading">Result</h2>
        <!-- Heading labelling the result area. -->

        <p id="result-question" class="result__question" hidden></p>
        <!-- A small line showing the decision question, e.g. "Where should
             we go for the holiday?". It starts hidden and stays hidden
             unless the user actually typed a question — that way, an empty
             question shows nothing at all rather than a blank line. -->

        <p id="result" class="result__value" aria-live="polite">—</p>
        <!-- Where the winning option appears, once the wheel has stopped.
             aria-live="polite" tells screen readers to announce the text
             when it changes, without interrupting whatever is being read.
             Only this line is announced: the user already knows the
             question, because they typed it. -->
      </section>
    </main>

    <script src="script.js"></script>
    <!-- Loads your JavaScript file. It's empty for now, so the page is static. -->
  </body>
</html>
